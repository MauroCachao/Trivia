{% extends "base.html" %}
{% block title %}Jogadores{% endblock %}
{% block content %}

<!-- Fundo -->
<div class="bg-img" style="
    background-image: url('{{ url_for('static', filename='img/bg_inicio.jpg') }}');
    filter: brightness(0.35);
"></div>

<div class="card fade-in" style="max-width:700px;">

    <h1 class="title">Configurar Jogadores</h1>

    <form method="POST">

        {% for i in range(num_jogadores) %}
        <div class="player-box">

            <h3>Jogador {{ i + 1 }}</h3>

            <!-- Nome -->
            <label>Nome:</label>
            <input type="text" name="nome{{ i }}" required
                   placeholder="Nome do jogador"
                   class="input-text">

            <!-- Avatar -->
            <label style="margin-top:10px;">Avatar:</label>

            <div class="avatar-select">
                {% for a in range(1, 7) %}
                <label class="avatar-option">
                    <input type="radio" name="avatar{{ i }}" value="avatar{{ a }}.png" required>
                    <img src="{{ url_for('static', filename='avatars/avatar' ~ a ~ '.png') }}"
                         class="avatar-choice">
                </label>
                {% endfor %}
            </div>

        </div>
        <hr style="border-color:#444;">
        {% endfor %}

        <div style="text-align:center; margin-top:20px;">
            <button type="submit" class="btn pulse">Continuar</button>
        </div>

    </form>

</div>

<style>
.player-box {
    margin-bottom: 20px;
}

.input-text {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin-top: 5px;
}

.avatar-select {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.avatar-option input {
    display: none;
}

.avatar-choice {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    border: 3px solid transparent;
    transition: 0.2s;
}

.avatar-option input:checked + .avatar-choice {
    border-color: #00aaff;
    transform: scale(1.1);
}
</style>

{% endblock %}
