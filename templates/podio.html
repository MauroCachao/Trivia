<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Pódio</title>

<style>
    body {
        background: #111;
        color: white;
        text-align: center;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    h1 {
        margin-top: 40px;
        font-size: 48px;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .podio {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        margin-top: 80px;
        gap: 40px;
        flex-wrap: wrap;
    }

    .jogador {
        width: 200px;
        animation: subir 1.2s ease forwards;
        opacity: 0;
    }

    @keyframes subir {
        from { transform: translateY(80px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
    }

    .pos1 { animation-delay: 0.2s; }
    .pos2 { animation-delay: 0.4s; }
    .pos3 { animation-delay: 0.6s; }

    .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid white;
        margin-bottom: 10px;
        object-fit: cover;
    }

    .nome {
        font-size: 24px;
        margin-bottom: 10px;
    }

    .queijos {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    /* QUEIJOS COM BRILHO */
    .queijo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        animation: brilho 1.8s infinite ease-in-out;
        box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    @keyframes brilho {
        0%   { transform: scale(1);   box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        50%  { transform: scale(1.35); box-shadow: 0 0 14px rgba(255,255,255,0.9); }
        100% { transform: scale(1);   box-shadow: 0 0 6px rgba(255,255,255,0.4); }
    }

    .btn {
        margin-top: 60px;
        padding: 15px 30px;
        background: #FFD700;
        color: black;
        font-size: 22px;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
    }

    /* CONFETTI */
    .confetti {
        position: fixed;
        top: -10px;
        width: 10px;
        height: 14px;
        opacity: 0.9;
        animation: cair 3.5s linear forwards;
        z-index: 10;
    }

    @keyframes cair {
        0%   { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }
</style>

</head>
<body>

<h1>🏆 PÓDIO FINAL 🏆</h1>

<div class="podio">

    {% for j in jogadores %}
    <div class="jogador pos{{ loop.index }}">
        {% if j.avatar %}
            <img src="{{ j.avatar }}" class="avatar">
        {% else %}
            <div class="avatar" style="background:#444; display:flex; align-items:center; justify-content:center;">
                ?
            </div>
        {% endif %}

        <div class="nome">{{ loop.index }}º - {{ j.nome }}</div>

        <div class="queijos">
            {% for q in j.queijos %}
                <div class="queijo" style="background: {{ cores_queijo[q] }}"></div>
            {% endfor %}
        </div>

        <div style="margin-top: 10px; font-size: 20px;">
            {{ j.queijos|length }} queijos
        </div>
    </div>
    {% endfor %}

</div>

<a class="btn" href="{{ url_for('index') }}">Jogar Novamente</a>

<script>
function lançarConfetti() {
    const confettiCount = 180;
    const colors = ["#FFD700", "#FF4500", "#1E90FF", "#32CD32", "#FF1493", "#8A2BE2", "#FFA500"];

    for (let i = 0; i < confettiCount; i++) {
        const conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.animationDelay = Math.random() * 2 + "s";
        conf.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        document.body.appendChild(conf);

        setTimeout(() => conf.remove(), 4000);
    }
}

lançarConfetti();
</script>

</body>
</html>
