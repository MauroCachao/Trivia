<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Evento</title>

<style>
    body {
        background: #222;
        color: white;
        text-align: center;
        font-family: Arial;
    }

    .container {
        margin-top: 120px;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    /* BOLINHA DO QUEIJO */
    .queijo {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 20px auto;
        animation: desaparecer 1.8s ease forwards;
    }

    /* ANIMAÇÃO DE DESAPARECER */
    @keyframes desaparecer {
        0%   { opacity: 1; transform: scale(1); }
        40%  { opacity: 1; transform: scale(1.3); }
        70%  { opacity: 0.6; transform: scale(0.6); }
        100% { opacity: 0; transform: scale(0); }
    }

    .btn {
        margin-top: 40px;
        padding: 15px 30px;
        background: #FFD700;
        color: black;
        font-size: 22px;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
    }
</style>

</head>
<body>

<div class="container">

    {% if evento == "PERDER_QUEIJO" %}
        <h1>O jogador perdeu o queijo:</h1>
        <h2>{{ queijo }}</h2>

        <div class="queijo" style="background: {{ cor }}"></div>

    {% elif evento == "SEM_QUEIJO" %}
        <h1>O jogador não tinha queijo para perder</h1>

    {% elif evento == "PERDER_A_VEZ" %}
        <h1>O jogador perdeu a vez</h1>
    {% endif %}

    <a class="btn" href="{{ url_for('roda') }}">Continuar</a>

</div>

</body>
</html>
